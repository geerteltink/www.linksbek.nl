baseURL = "/"
languageCode = "nl-NL"
title = "linksbek.nl"
googleAnalytics = "UA-147731969-1"
enableRobotsTxt = true
enableGitInfo = true
disableKinds = ["taxonomy", "taxonomyTerm"]
disqusShortname = "linksbek"
copyright = "Peter Bonder"
rssLimit = 10
summarylength = 30

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
      
[author]
    name = "Peter Bonder"

[imaging]
    resampleFilter = "Linear"
    quality = 80

[permalinks]
    posts = "/:year/:month/:slug/"
